global:
  cesconfig:
    fqdn: ecosystem.localdomain

# Values for the included XWiki chart
xwiki:
  fullnameOverride: xwiki

  # Pull the public XWiki image directly from Docker Hub
  image:
    name: docker.io/library/xwiki
    tag: 18.6.0-mysql-tomcat
    pullPolicy: IfNotPresent

  # Make XWiki available below /xwiki
  extraEnvVars:
    - name: CONTEXT_PATH
      value: xwiki

  # Start XWiki only after MySQL is available
  initContainers:
    database:
      enabled: true

  # Adjust the Kubernetes probes to the /xwiki path
  probes:
    startup:
      httpGet:
        path: /xwiki/rest
    liveness:
      httpGet:
        path: /xwiki/rest
    readiness:
      httpGet:
        path: /xwiki/rest/wikis/xwiki/spaces

  mysql:
    auth:
      rootPassword: ""
      username: xwiki
      password: ""
      database: xwiki

  customConfigs:
    xwiki.cfg:
      xwiki.authentication.authclass: org.xwiki.contrib.oidc.auth.OIDCAuthServiceImpl
    xwiki.properties:
      oidc.endpoint.token.auth_method: "client_secret_basic"
      oidc.endpoint.userinfo.method: "GET"
      oidc.logoutMechanism: "rpInitiated"
      # hard-code for now
      oidc.provider: https://quickstart.k3ces.localdomain/cas/oidc
      oidc.skipped: false
      # so können wir gruppen nach XWiki spiegeln
      oidc.groups.claim: customobject.customgroups
      # hard-code for now
      oidc.groups.mapping: "XWikiAdminGroup=admin"

  customConfigSecrets:
    xwiki.properties:
      oidc.clientid:
        secret:
          name: xwiki-oidc-credentials
          key: oidc_client_id
      oidc.secret:
        secret:
          name: xwiki-oidc-credentials
          key: oidc_client_secret